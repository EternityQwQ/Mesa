name: Sync upstream Mesa

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream Mesa branch or tag
        required: true
        default: main
        type: string
      dry_run:
        description: Create the sync commit without pushing it
        required: true
        default: false
        type: boolean

concurrency:
  group: sync-upstream-mesa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UPSTREAM_URL: https://gitlab.freedesktop.org/mesa/mesa.git
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Mesa source tree
        run: |
          set -euo pipefail

          if [ -z "$UPSTREAM_REF" ]; then
            echo "::error::upstream_ref must not be empty"
            exit 1
          fi
          case "$UPSTREAM_REF" in
            -*) echo "::error::invalid upstream_ref: $UPSTREAM_REF"; exit 1 ;;
          esac

          before=$(git rev-parse --short HEAD)

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --depth=1 --no-recurse-submodules \
            upstream "$UPSTREAM_REF"
          upstream_sha=$(git rev-parse --short=12 'FETCH_HEAD^{commit}')

          # This repository was imported as an unrelated snapshot, so there is no
          # common ancestor to merge. Mirror upstream's tree, then restore this
          # repository's CI configuration exactly as it is in HEAD. Removing any
          # upstream .github first also drops paths that exist only upstream.
          git read-tree -u --reset 'FETCH_HEAD^{commit}'
          git rm -r -f --ignore-unmatch --quiet -- .github
          if git cat-file -e HEAD:.github 2>/dev/null; then
            git checkout HEAD -- .github
          fi

          if ! git diff --cached --quiet HEAD -- .github; then
            echo "::error::.github does not match HEAD after restore"
            git diff --cached --stat HEAD -- .github || true
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date with upstream Mesa ($upstream_sha)."
            {
              echo "### Upstream Mesa sync"
              echo ""
              echo "Already up to date: \`$upstream_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "Sync with upstream Mesa $upstream_sha"

          {
            echo "### Upstream Mesa sync"
            echo ""
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Upstream: \`$UPSTREAM_REF\` at \`$upstream_sha\`"
            echo "- Previous: \`$before\`"
            echo "- New: \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo '```'
            git show --stat --format='%h %s' HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; not pushing."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
